<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="yaroslav">
    <allow own="org.n14control.Fans1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.n14control.Fans1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.n14control.Fans1" send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="org.n14control.Fans1" send_interface="org.n14control.Fans1" send_member="Status"/>
    <allow send_destination="org.n14control.Fans1" send_interface="org.n14control.Fans1" send_member="SetMode"/>
    <allow send_destination="org.n14control.Fans1" send_interface="org.n14control.Fans1" send_member="SetKeylight"/>
    <allow send_destination="org.n14control.Fans1" send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>